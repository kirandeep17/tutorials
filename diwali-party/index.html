<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Diwali Party Planner</title>
  <meta name="description" content="Plan your Diwali party: guests, dishes and expenses in one place." />
  <meta name="theme-color" content="#17120e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fff8f4" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Diwali Party" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,cake,celebration,check,check_circle,close,dark_mode,delete,download,edit,group,ios_share,light_mode,local_fire_department,lunch_dining,payments,person_add,phone,restaurant,search,settings,upload,wallet&display=block" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient background: stars + floating lanterns -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="lanterns" id="lanterns"></div>
  </div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <header class="appbar" id="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <span class="brand-diya" aria-hidden="true"><span class="flame"></span></span>
        <div>
          <p class="eyebrow" id="eyebrow">शुभ दीपावली</p>
          <h1 id="partyName">Diwali Night</h1>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><span class="ms">dark_mode</span></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Party settings"><span class="ms">settings</span></button>
    </div>
  </header>

  <main id="main">
    <!-- OVERVIEW -->
    <section class="view active" id="view-overview" data-view="overview">
      <article class="hero" id="hero">
        <canvas id="heroFx" aria-hidden="true"></canvas>
        <svg class="rangoli" viewBox="0 0 200 200" aria-hidden="true">
          <g fill="none" stroke-width="1.6">
            <circle cx="100" cy="100" r="86" stroke="currentColor" opacity=".25" stroke-dasharray="2 6" />
            <g class="petals-a"></g>
            <g class="petals-b"></g>
            <circle cx="100" cy="100" r="14" stroke="currentColor" opacity=".7" />
          </g>
        </svg>
        <div class="hero-content">
          <span class="chip-tonal" id="heroBadge"><span class="ms fill">celebration</span> Festival of Lights</span>
          <h2 class="hero-title" id="heroTitle">Diwali Night</h2>
          <p class="hero-date" id="heroDate"></p>
          <div class="countdown" id="countdown" role="timer" aria-live="off">
            <div><b data-cd="d">00</b><span>days</span></div>
            <div><b data-cd="h">00</b><span>hrs</span></div>
            <div><b data-cd="m">00</b><span>min</span></div>
            <div><b data-cd="s">00</b><span>sec</span></div>
          </div>
        </div>
        <div class="diyas" aria-hidden="true">
          <span class="diya"><span class="flame"></span></span>
          <span class="diya"><span class="flame"></span></span>
          <span class="diya"><span class="flame"></span></span>
          <span class="diya"><span class="flame"></span></span>
          <span class="diya"><span class="flame"></span></span>
        </div>
        <p class="hero-hint">Tap anywhere for fireworks ✨</p>
      </article>

      <div class="stat-grid">
        <button class="stat" data-goto="guests">
          <span class="stat-icon s-primary"><span class="ms fill">group</span></span>
          <span class="stat-num" data-count="headcount">0</span>
          <span class="stat-label">Expected guests</span>
          <span class="stat-sub" id="statGuestsSub"></span>
        </button>
        <button class="stat" data-goto="dishes">
          <span class="stat-icon s-secondary"><span class="ms fill">restaurant</span></span>
          <span class="stat-num" data-count="dishes">0</span>
          <span class="stat-label">Dishes planned</span>
          <span class="stat-sub" id="statDishesSub"></span>
        </button>
        <button class="stat" data-goto="expenses">
          <span class="stat-icon s-tertiary"><span class="ms fill">payments</span></span>
          <span class="stat-num" data-count="spent" data-money>0</span>
          <span class="stat-label">Total spend</span>
          <span class="stat-sub" id="statSpentSub"></span>
        </button>
        <div class="stat">
          <span class="stat-icon s-gold"><span class="ms fill">wallet</span></span>
          <span class="stat-num" data-count="perGuest" data-money>0</span>
          <span class="stat-label">Cost per guest</span>
          <span class="stat-sub">based on expected guests</span>
        </div>
      </div>

      <article class="card budget-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="50" />
            <circle class="ring-bar" id="ringBar" cx="60" cy="60" r="50" pathLength="100" />
          </svg>
          <div class="ring-label"><b id="ringPct">0%</b><span>of budget</span></div>
        </div>
        <div class="budget-info">
          <h3>Budget</h3>
          <p class="big" id="budgetLeft"></p>
          <p class="muted" id="budgetLine"></p>
          <button class="btn-text" id="editBudgetBtn"><span class="ms">edit</span> Set budget</button>
        </div>
      </article>

      <article class="card">
        <div class="card-head"><h3>Where the money goes</h3></div>
        <div id="breakdown" class="breakdown"></div>
      </article>

      <article class="card">
        <div class="card-head"><h3>RSVP status</h3></div>
        <div class="rsvp-bar" id="rsvpBar"></div>
        <div class="rsvp-legend" id="rsvpLegend"></div>
      </article>

      <div class="data-actions">
        <button class="btn-tonal" id="shareBtn"><span class="ms">ios_share</span> Share summary</button>
      </div>
    </section>

    <!-- GUESTS -->
    <section class="view" id="view-guests" data-view="guests">
      <div class="section-head">
        <h2>Guests</h2>
        <p class="muted" id="guestSummary"></p>
      </div>
      <label class="search">
        <span class="ms">search</span>
        <input type="search" id="guestSearch" placeholder="Search guests" autocomplete="off" enterkeyhint="search" />
      </label>
      <div class="chips" id="guestFilters" role="tablist">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="going">Going</button>
        <button class="chip" data-filter="maybe">Maybe</button>
        <button class="chip" data-filter="invited">Invited</button>
        <button class="chip" data-filter="declined">Declined</button>
      </div>
      <ul class="list" id="guestList"></ul>
    </section>

    <!-- DISHES -->
    <section class="view" id="view-dishes" data-view="dishes">
      <div class="section-head">
        <h2>Dishes</h2>
        <p class="muted" id="dishSummary"></p>
      </div>
      <div class="mini-stats" id="dishStats"></div>
      <div class="chips" id="dishFilters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="Starters">Starters</button>
        <button class="chip" data-filter="Mains">Mains</button>
        <button class="chip" data-filter="Breads & Rice">Breads & Rice</button>
        <button class="chip" data-filter="Sweets">Sweets</button>
        <button class="chip" data-filter="Drinks">Drinks</button>
      </div>
      <ul class="list" id="dishList"></ul>
    </section>

    <!-- EXPENSES -->
    <section class="view" id="view-expenses" data-view="expenses">
      <div class="section-head">
        <h2>Expenses</h2>
        <p class="muted" id="expenseSummary"></p>
      </div>
      <div class="mini-stats" id="expenseStats"></div>
      <ul class="list" id="expenseList"></ul>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Add"><span class="ms">add</span><span class="fab-label" id="fabLabel">Add</span></button>

  <nav class="navbar" id="navbar" aria-label="Sections">
    <button class="nav-item active" data-nav="overview"><span class="nav-pill"><span class="ms">local_fire_department</span></span><span>Home</span></button>
    <button class="nav-item" data-nav="guests"><span class="nav-pill"><span class="ms">group</span></span><span>Guests</span></button>
    <button class="nav-item" data-nav="dishes"><span class="nav-pill"><span class="ms">lunch_dining</span></span><span>Dishes</span></button>
    <button class="nav-item" data-nav="expenses"><span class="nav-pill"><span class="ms">payments</span></span><span>Expenses</span></button>
  </nav>

  <!-- Bottom sheet -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" id="sheetHandle"><span></span></div>
    <div class="sheet-head">
      <h3 id="sheetTitle">Add</h3>
      <button class="icon-btn" id="sheetClose" aria-label="Close"><span class="ms">close</span></button>
    </div>
    <form id="sheetForm" class="sheet-body" autocomplete="off" novalidate></form>
  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span id="snackText"></span>
    <button id="snackAction" class="btn-text"></button>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
